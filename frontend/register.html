<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DollarVault - Create Account</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f7fb;
            padding: 20px;
        }

        .register-container {
            width: 100%;
            max-width: 450px;
        }

        .register-card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            margin: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111827;
            color: white;
            border-radius: 50%;
            font-size: 28px;
            font-weight: bold;
        }

        .logo h1 {
    margin-top: 12px;
    font-size: 26px;
    color: #111827;
}

.logo h1 span {
    color: #16a34a;
}

        .logo p {
            margin-top: 6px;
            color: #6b7280;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #374151;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #111827;
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            margin-top: 5px;
            border: none;
            border-radius: 9px;
            background: #111827;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-btn:hover {
            background: #1f2937;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 11px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #6b7280;
            font-size: 14px;
        }

        .login-link a {
            color: #111827;
            font-weight: bold;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="register-container">

        <div class="register-card">

            <div class="logo">
                <div class="logo-icon">$</div>
                <h1><span>Dollar</span>Vault</h1>
                <p>Create your digital wallet account</p>
            </div>

            <form id="registerForm">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="6"
                        required
                    >
                </div>

                <button type="submit" class="register-btn">
                    Create Account
                </button>

                <div id="message" class="message"></div>

            </form>

            <div class="login-link">
                Already have an account?
                <a href="login.html">Login</a>
            </div>

        </div>

    </div>

    <script>
    document.getElementById("registerForm").addEventListener("submit", async function(event) {
        event.preventDefault();

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        const message = document.getElementById("message");

        message.style.display = "block";
        message.style.background = "#f3f4f6";
        message.style.color = "#374151";
        message.textContent = "Creating your demo account...";

        if (password !== confirmPassword) {
            message.style.background = "#fee2e2";
            message.style.color = "#991b1b";
            message.textContent = "Passwords do not match.";
            return;
        }

        try {
            const response = await fetch("http://127.0.0.1:3000/api/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name: name,
                    email: email,
                    password: password,
                    confirmPassword: confirmPassword
                })
            });

            const data = await response.json();

            if (data.success) {
                message.style.background = "#dcfce7";
                message.style.color = "#166534";
                message.textContent = "Demo account created successfully.";

                setTimeout(function() {
                    window.location.href = "login.html";
                }, 1500);

                return;
            }

            message.style.background = "#fee2e2";
            message.style.color = "#991b1b";
            message.textContent = data.message;

        } catch (error) {
            console.error("Registration error:", error);

            message.style.background = "#fee2e2";
            message.style.color = "#991b1b";
            message.textContent =
                "Cannot connect to the DollarVault server.";
        }
    });
</script>

</body>
</html>
